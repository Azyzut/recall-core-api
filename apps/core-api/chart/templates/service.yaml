apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}
  labels:
    app: {{ .Chart.Name }}
spec:
  # ClusterIP for every component. Only Web UI and Core API are reachable from
  # outside, and that is via the Ingress in the web-ui chart -- never directly.
  type: ClusterIP
  selector:
    app: {{ .Chart.Name }}
  ports:
    - port: 3001
      targetPort: 3001
      protocol: TCP
