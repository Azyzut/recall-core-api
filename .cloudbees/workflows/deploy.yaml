apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: deploy

# Reusable: the Application-level deployer calls this once per environment.
on:
  workflow_call:
    inputs:
      artifact-id:
        type: string
        required: true
      version:
        type: string
        required: true
      environment:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      artifact-id:
        type: string
        required: true
        description: >-
          Artifact ID from the build's evidence tab. Deploying it records this
          release against the environment. Use `manual` to deploy without
          recording it — useful when testing, useless for traceability.
        default: manual
      version:
        type: string
        required: true
        description: >-
          The image tag to deploy: the commit SHA shown as Version in the build's
          evidence tab. Builds push only a SHA tag, so there is no `latest`.
      environment:
        type: string
        required: true
        default: DEV

permissions:
  scm-token-own: read
  scm-token-org: read

jobs:
  deploy:
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: cloudbees-io/checkout@v2

      - name: Check the version to deploy
        uses: docker://alpine:latest
        env:
          DEPLOY_VERSION: ${{ inputs.version }}
        run: |
          # Builds push a commit-SHA tag only. `latest` has never existed, and an
          # absent tag pulls nothing. Catching it here costs one step and avoids an
          # ImagePullBackOff that looks like a registry auth failure minutes later.
          if [ -z "$DEPLOY_VERSION" ] || [ "$DEPLOY_VERSION" = "latest" ]; then
            echo "version must be the image tag to deploy."
            echo "Use the commit SHA shown against artifact-id in the build evidence."
            echo "Builds push only a SHA tag, so 'latest' does not exist."
            exit 1
          fi
          echo "deploying version $DEPLOY_VERSION"

      - name: Set kubeconfig
        uses: docker://alpine:latest
        env:
          KCFG_B64: ${{ secrets.kubeconfig }}
        run: |
          set -eu
          umask 077
          mkdir -p /cloudbees/home/.kube
          printf '%s' "$KCFG_B64" | tr -d '\r\n ' | base64 -d > /cloudbees/home/.kube/config
          chmod 600 /cloudbees/home/.kube/config

      - name: Install helm chart
        id: install-chart
        uses: cloudbees-io/helm-install@v1
        with:
          chart-location: ${{ cloudbees.workspace }}/apps/core-api/chart
          release-name: recall-core-api
          namespace: ${{ vars.namespace }}
          values: |
            image:
              repository: docker.io/${{ vars.DOCKERHUB_USER }}/recall-core-api
              tag: ${{ inputs.version }}
            env:
              DATABASE_SSL: ""
              AUTH_TRUST_HOST: "true"
              AWS_REGION: us-east-1
              AI_SERVICE_URL: http://recall-ai-service:8080
              RECALL_WORKER_URL: http://recall-worker:8080
              S3_BUCKET: ${{ vars.S3_BUCKET }}
              NEXTAUTH_URL: http://${{ vars.hostname }}
            secretEnv:
              DATABASE_URL: ${{ toJSON(secrets.DATABASE_URL) }}
              AUTH_SECRET: ${{ toJSON(secrets.AUTH_SECRET) }}
              # `unset` is the sentinel for "no SDK key yet": Unify refuses to
              # store an empty variable value, so attendees cannot leave this
              # blank before Module 07. Map it to an empty string, or the SDK
              # tries to authenticate with the literal word `unset` instead of
              # taking its documented no-key path.
              #
              # Written as `!= 'unset' && value || ''` deliberately. The natural
              # `== 'unset' && '' || value` does NOT work: '' is falsy, so the
              # ternary falls through to value precisely when the sentinel is set.
              FM_KEY: ${{ toJSON(vars.FM_KEY != 'unset' && vars.FM_KEY || '') }}
              ADMIN_PASSWORD: ${{ toJSON(secrets.ADMIN_PASSWORD) }}
              VOYAGE_API_KEY: ${{ toJSON(secrets.VOYAGE_API_KEY) }}

      - name: Register deployed artifact
        if: ${{ inputs.artifact-id != 'test-deploy' && inputs.artifact-id != 'manual' && inputs.artifact-id != '' }}
        uses: cloudbees-io/register-deployed-artifact@v2
        with:
          artifact-id: ${{ inputs.artifact-id }}
          target-environment: ${{ inputs.environment }}

      - name: Publish deploy evidence
        uses: cloudbees-io/publish-evidence-item@v1
        with:
          content: |-
            ## recall-core-api deployed to ${{ inputs.environment }}
            - **Image:** recall-core-api:${{ inputs.version }}
            - **Namespace:** ${{ vars.namespace }}
            - **Artifact ID:** ${{ inputs.artifact-id }}
          format: MARKDOWN
